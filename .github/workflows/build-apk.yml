name: Build Android APK

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - 'playstore.js'
      - 'playstore.html'
      - 'www/playstore.js'
      - 'www/playstore.html'
      - 'README.md'
  pull_request:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Sync Capacitor
        run: |
          chmod +x node_modules/.bin/capacitor || true
          npx capacitor sync android
          npm run assets

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/hdfc_help_v3.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hdfc_help_v3.apk
          path: android/app/build/outputs/apk/debug/hdfc_help_v3.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          files: android/app/build/outputs/apk/debug/hdfc_help_v3.apk
          tag_name: v3.0.${{ github.run_number }}
          name: HDFC CARD HELP v3.0 (Build ${{ github.run_number }})
          body: |
            Direct APK Download for HDFC CARD HELP.
            File: hdfc_help_v3.apk
            Build Number: ${{ github.run_number }}
            VERSION: 3.0 (TOTAL REBRAND)
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
